name: CI

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  ANDROID_CLI_VERSION: 1.0.15985488
  ANDROID_CLI_SHA256: 7d0f4b41e6511ab6eeeaec4b885442f02aded270cf83cb75f521aca2c03d593d

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android CLI
        shell: bash
        run: |
          cli_dir="${RUNNER_TEMP}/android-cli"
          cli_url="https://dl.google.com/android/cli/${ANDROID_CLI_VERSION}/linux_x86_64/android"
          install -d "$cli_dir"
          curl -fsSL "$cli_url" -o "$cli_dir/android"
          echo "${ANDROID_CLI_SHA256}  $cli_dir/android" | sha256sum --check
          chmod +x "$cli_dir/android"
          echo "$cli_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Test the generator and layout clearances
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/generate_watchface.py --check
          python3 tools/check_layout.py

      - name: Build the APK and app bundle
        run: ./gradlew --no-daemon check assembleDebug bundleRelease :watchface:assemblePrototype

      - name: Preserve the side-by-side prototype APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heart-history-prototype
          path: |
            watchface/build/outputs/apk/prototype/watchface-prototype.apk
            history/build/outputs/apk/debug/history-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install the isolated cover emulator
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools cmdline-tools/latest emulator system-images/android-37.0/android-wear-signed/x86_64

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Build and capture the project cover
        run: python3 tools/capture_cover.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: docs/screenshots
      - name: Commit changed cover from this build
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/cover.png
          git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
          git push origin HEAD:main
